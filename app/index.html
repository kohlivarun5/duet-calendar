<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta
      http-equiv="refresh"
      content="0; url=https://apps.apple.com/app/apple-store/id6756833862?pt=96322844&amp;ct=duet_web_app_redirect_202609&amp;mt=8"
    />
    <link rel="canonical" href="https://apps.apple.com/app/apple-store/id6756833862" />
    <title>Open Duet on the App Store</title>
    <script>
      (function () {
        var destination = new URL("https://apps.apple.com/app/apple-store/id6756833862");
        destination.searchParams.set("pt", "96322844");
        destination.searchParams.set("ct", "duet_web_app_redirect_202609");
        destination.searchParams.set("mt", "8");

        var incomingParams = new URLSearchParams(window.location.search);
        ["ct", "ppid"].forEach(function (key) {
          var value = incomingParams.get(key);
          if (value) {
            destination.searchParams.set(key, value);
          }
        });

        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body>
    <p>
      Opening Duet on the App Store…
      <a href="https://apps.apple.com/app/apple-store/id6756833862?pt=96322844&amp;ct=duet_web_app_redirect_202609&amp;mt=8">
        Continue to the App Store
      </a>
    </p>
  </body>
</html>
