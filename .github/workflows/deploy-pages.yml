name: Deploy Duet calendar site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - scripts/stage_pages.py
      - scripts/test_stage_pages.py
      - CNAME
      - "**/*.html"
      - "**/*.xml"
      - "**/*.txt"
      - assets/**
      - ads/**
      - styles.css
      - "!workers/**"
      - "!docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate crawl paths and assets
        run: python3 scripts/validate_site.py && node scripts/test_attribution.cjs
      - name: Test public packaging and stage website
        run: python3 -B -m unittest discover -s scripts -p 'test_stage_pages.py' && python3 scripts/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
